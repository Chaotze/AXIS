# ============================================================
# Cargo 构建配置 - 裸机目标（x86_64-axis）专用
# ============================================================
# 该配置文件位于项目根目录下的 .cargo/config.toml
# 用于配置针对特定嵌入式/裸机平台的编译参数和 unstable 特性

# ------------------------------------------------------------
# 构建目标配置
# ------------------------------------------------------------
# 指定默认的编译目标，使用自定义的 JSON 目标描述文件
# 该文件定义了 x86_64-axis 裸机平台的内存布局、CPU 特性等
# 相当于执行 cargo build --target x86_64-axis.json
[build]
target = "x86_64-axis.json"

# ------------------------------------------------------------
# Unstable（不稳定）特性配置 - 用于裸机开发
# ------------------------------------------------------------
# 这些配置需要 nightly Rust 编译器支持
[unstable]
# build-std: 指定需要由 Cargo 重新构建的核心系统库
# 包含 "core"（Rust 核心库，无操作系统依赖）和
# "compiler_builtins"（编译器内建函数，如整数溢出、内存操作等）
# 原因：裸机环境没有预编译的标准库，必须在编译时从源码构建
build-std = ["core", "compiler_builtins"]

# build-std-features: 为上述构建的标准库启用额外功能
# "compiler-builtins-mem" 启用编译器内建的内存操作函数
# （如 memcpy, memmove, memset），这些在裸机环境中通常由
# 编译器内建提供，避免依赖外部 C 库
build-std-features = ["compiler-builtins-mem"]

# json-target-spec: 告知 Cargo 目标描述文件是 JSON 格式
# 当 target 指定为 .json 文件时，需要启用此选项，
# 否则 Cargo 会将其当作内置目标三元组（如 x86_64-unknown-none）
json-target-spec = true

# ============================================================
# 补充说明：
# 1. 为什么需要 build-std？因为 x86_64-axis 是裸机平台，没有操作系统
#    提供标准库（std），因此需要自己构建 core 库和编译器内建函数。
# 2. 为什么需要 nightly？build-std 和 json-target-spec 都是不稳定特性，
#    只能在 nightly 工具链下使用。可以通过 `rustup override set nightly`
#    在项目目录设置 nightly 为默认工具链。
# 3. 如果不需要 mem 相关内建函数，可以移除 "compiler-builtins-mem"，
#    但大多数裸机程序需要 memcpy/memset 等操作，通常建议保留。
# 4. 目标文件 x86_64-axis.json 定义了链接器脚本、默认 CPU 特性、
#    堆栈大小、异常处理方式等平台细节，是裸机编译的核心配置文件。
# 5. 若需要在 Linux 等有 OS 环境下测试部分功能，可以通过
#    `cargo build --target x86_64-unknown-linux-gnu` 临时覆盖默认目标。
# ============================================================
