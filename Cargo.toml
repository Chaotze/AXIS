# ============================================================
# Cargo 工作区（Workspace）配置 - AXIS
# ============================================================
# 该文件位于项目根目录，是 Cargo 工作区的入口配置文件
# 工作区用于管理多个相互关联的 crate（子包），共享依赖和构建配置

# ------------------------------------------------------------
# 工作区成员（Workspace Members）
# ------------------------------------------------------------
[workspace]
# members: 工作区包含的子包列表，每个子包都是一个独立的 Rust crate
# 这些目录必须包含 Cargo.toml 文件，且位于工作区根目录下
# 工作区还支持隐式成员：如果根目录下有子目录包含 Cargo.toml，
# 且没有被显式列出，可以使用 "members = ["*"]" 自动发现
members = ["bootloader/bios", "bootloader/uefi", "kernel", "unitest"]

# resolver: 依赖解析器版本
# 解析器版本的区别：
#   - Resolver 1（默认在 Rust 2015/2018/2021 早期）：简单依赖解析
#   - Resolver 2（可选，Rust 2021+）：改进的依赖解析算法
#   - Resolver 3（Rust 2024+ 默认）：最新的解析器版本
# 
# 注意：resolver 版本需要与 Rust 编译器版本匹配
#       resolver 3 需要 Rust 1.75+（2024 Edition 的要求）
resolver = "3"

# ------------------------------------------------------------
# 工作区通用包元数据（Workspace Package Metadata）
# ------------------------------------------------------------
# [workspace.package] 是 Cargo 工作区中用于定义通用包元数据的特殊节
# 该节定义的字段会被工作区中的所有成员包继承，避免在每个成员包中重复定义
# 
# 工作原理：
#   - 成员包可以通过 `{ field_name = workspace = true }` 继承这些值
#   - 如果成员包显式定义了同名字段，则会覆盖继承的值
#   - 未显式继承的成员包不会自动获得这些值（需要显式声明）
[workspace.package]

# authors: 项目作者列表
# 格式：`人名 <邮箱>`
authors = ["Haoze Qin", "Borui Li", "Zhi Zheng"]

# version: 定义所有成员包的统一版本号
# 遵循语义化版本规范（SemVer），格式为 MAJOR.MINOR.PATCH
# 
# 语义化版本规范：
#   - 当进行不兼容的 API 变更时升级 MAJOR 版本
#   - 添加新功能但保持兼容时升级 MINOR 版本
#   - 修复 bug 而不改变功能时升级 PATCH 版本
version = "0.1.3"

# edition: 定义所有成员包使用的 Rust 版本
edition = "2024"

# ------------------------------------------------------------
# 开发构建配置（dev profile）
# ------------------------------------------------------------
# profile.dev 定义了执行 `cargo build`（默认）或 `cargo build --profile dev`
# 时的编译优化设置，这些配置会应用到工作区中的所有成员包
[profile.dev]
# panic = "abort": panic 时直接终止程序，不进行栈展开（unwind）
# 
# 默认行为：panic = "unwind"（栈展开，清理资源）
# 
# 为什么在开发构建中也使用 abort？
#   - 裸机环境没有运行时进行栈展开（需要 .eh_frame 等元数据）
#   - 即使开发阶段，也需要保持与生产环境的一致性
#   - 避免链接错误：如果内核依赖的某些库不支持 unwind
#   - 减少二进制体积，加快编译速度（不需要生成 unwind 信息）
#   - 简化 panic 处理：只需一个简单的 panic_handler 函数
#   - 对于操作系统开发，panic 通常意味着系统崩溃，不需要清理资源
# 
# 注意事项：
#   - 使用 abort 意味着 Drop 在 panic 时不会被调用
#   - 在开发调试时，可能需要更多的 panic 信息（如位置和堆栈）
#   - 可以通过 panic_handler 自定义 panic 行为（如串口输出）
panic = "abort"

# ------------------------------------------------------------
# 发布构建配置（release profile）
# ------------------------------------------------------------
# profile.release 定义了执行 `cargo build --release` 时的编译优化设置
# 用于生产环境的内核和引导程序构建
[profile.release]
# panic = "abort": 与开发构建保持一致，确保 panic 行为统一
panic = "abort"

# lto = true: 启用链接时优化（Link-Time Optimization）
# 
# LTO 的作用：
#   - 在整个程序（包括所有依赖库）上进行跨 crate 优化
#   - 内联（inline）跨 crate 边界的函数调用
#   - 去除死代码（dead code elimination）更彻底
#   - 全局常量传播和优化
# 
# 对内核项目的优势：
#   - 显著减少二进制体积（通常 20-40%）
#   - 提高运行性能（关键路径优化更充分）
#   - 移除未使用的函数和数据，减小内存占用
#   - 特别适合对体积敏感的裸机环境
lto = true

# opt-level: 优化级别
#
# 可选值：
#   - 0: 无优化（快速编译，适合开发）
#   - 1: 基础优化（平衡编译速度和运行性能）
#   - 2: 中等优化（默认 release 级别）
#   - 3: 最高优化（可能增加二进制体积）
#   - "s": 优化二进制体积（size，推荐嵌入式）
#   - "z": 最大化减少体积（比 s 更激进）
#
# 可能的调整：
#   - 如果内核体积超过限制，考虑使用 opt-level = "s"
#   - 如果需要极致的性能（如实时系统），考虑 opt-level = 3
#   - 可以单独对某些关键 crate 设置不同的优化级别
opt-level = 2

# codegen-units = 1: 单个代码生成单元，更好的优化
codegen-units = 1

# strip = true: 去除符号表和调试信息
strip = true

# ============================================================
# 补充说明：
# 
# 1. 编译命令：
#    - 构建所有成员：`cargo build`（在工作区根目录）
#    - 构建特定成员：`cargo build -p bootloader`
#    - 清理：`cargo clean`（清理整个工作区的 target 目录）
# 
# 2. 依赖管理：
#    - 共享依赖：在工作区根 Cargo.toml 的 [dependencies] 中定义
#    - 本地依赖：成员包之间可以通过 path 依赖引用
#    - 示例：bootloader/Cargo.toml 中可添加
#      `kernel = { path = "../kernel" }`
# 
# 3. 目标（target）配置与工作区的关系：
#    - 工作区的每个成员包共享相同的 target 目录
# 
# 4. 构建脚本（build.rs）与工作区：
#    - 每个成员包可以有独立的 build.rs
#    - 工作区的构建脚本在各自包目录下执行
#    - 构建脚本的环境变量（如 CARGO_MANIFEST_DIR）指向各自包目录
# 
# 5. 交叉编译和裸机构建：
#    - 所有成员包都需要支持 no_std
#    - 工作区统一使用目标配置文件（.cargo/config.toml）
#    - 链接器脚本（linker.ld）在各成员包中独立管理
#    - 但可以在工作区根目录创建共享的构建工具
# 
# 6. 可能的扩展配置：
#    - `[workspace.package]`：定义通用包元数据
#    - `[workspace.dependencies]`：定义共享依赖版本
#    - `[profile.<name>]`：自定义编译 profile
#    - `[patch]`：替换依赖版本（用于调试）
# ============================================================
