# ============================================================
# Cargo 构建配置 - UEFI 目标（x86_64-unknown-uefi）
# ============================================================
# 该配置文件位于项目根目录下的 .cargo/config.toml
# 用于配置针对特定嵌入式/裸机平台的编译参数和 unstable 特性

# ------------------------------------------------------------
# 构建目标配置
# ------------------------------------------------------------
# 指定默认的编译目标为 UEFI 平台
# 相当于执行 cargo build --target x86_64-unknown-uefi
[build]
target = "x86_64-unknown-uefi"

# ------------------------------------------------------------
# Unstable（不稳定）特性配置 - 用于 UEFI 目标
# ------------------------------------------------------------
# 这些配置需要 nightly Rust 编译器支持
[unstable]
# build-std: UEFI 目标需要从源码构建标准库
# 包含 "core"（Rust 核心库）、"compiler_builtins"（编译器内建函数）
# 和 "alloc"（堆分配支持，UEFI 提供内存分配服务）
build-std = ["core", "compiler_builtins", "alloc"]

# build-std-features: 为上述构建的标准库启用额外功能
# "compiler-builtins-mem" 启用编译器内建的内存操作函数
build-std-features = ["compiler-builtins-mem"]

# ============================================================
# 补充说明：
# 1. 为什么需要 build-std？UEFI 是裸机环境，没有操作系统提供标准库（std），
#    因此需要自己构建 core 库和编译器内建函数，与裸机平台的要求一致。
# 2. 为什么需要 nightly？build-std 和自定义目标 JSON 都是不稳定特性，
#    只能在 nightly 工具链下使用。可以通过 `rustup override set nightly`
#    在项目目录设置 nightly 为默认工具链。
# 3. 如果不需要 mem 相关内建函数，可以移除 "compiler-builtins-mem"，
#    但 UEFI 程序通常需要 memcpy/memset 等操作（如处理数据结构），
#    建议保留。UEFI 固件本身不提供这些 C 运行时函数。
# 4. x86_64-unknown-uefi 是 Rust 官方内置目标，不需要额外的 JSON 目标
#    描述文件。其内存布局、调用约定（EFIAPI）、输出格式（PE32+ .efi）
#    均已由 Rust 团队预定义好，开箱即用。
# 5. 若需要在 Linux 等有 OS 环境下测试部分功能（如纯逻辑代码），
#    可以通过 `cargo build --target x86_64-unknown-linux-gnu` 
#    临时覆盖默认目标进行编译测试。
# ============================================================
