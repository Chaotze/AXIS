# ============================================================
# UEFI Bootloader - Cargo 配置
# ============================================================
# UEFI 模式引导加载程序，利用 UEFI 固件服务加载内核

[package]
name = "axis-bootloader-uefi"
authors.workspace = true
version.workspace = true
edition.workspace = true

# ------------------------------------------------------------
# 依赖项
# ------------------------------------------------------------
[dependencies]
# uefi: UEFI 规范的 Rust 实现
# 提供 UEFI 协议、服务、数据类型的封装
uefi = "0.32"

# ------------------------------------------------------------
# 构建配置说明
# ------------------------------------------------------------
# UEFI 应用程序的特殊要求：
#   - 目标平台：x86_64-unknown-uefi
#   - 可执行文件格式：PE32+（Windows PE 格式）
#   - 入口点：efi_main（由 uefi crate 提供）
#   - 不需要自定义链接脚本（由 rustc 内置）
