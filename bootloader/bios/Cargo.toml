# ============================================================
# BIOS Bootloader - Cargo 配置
# ============================================================
# BIOS 模式引导加载程序，负责从传统 BIOS 固件引导内核
# 包含 Stage1（MBR）和 Stage2（保护模式切换、ELF 加载）

[package]
name = "axis-bootloader-bios"
authors.workspace = true
version.workspace = true
edition.workspace = true

# ------------------------------------------------------------
# 库配置
# ------------------------------------------------------------
[lib]
# crate-type = ["staticlib"]: 生成静态库
#
# 为什么使用 staticlib？
#   - Stage2 Rust 代码需要链接到汇编引导代码
#   - 使用自定义链接脚本（stage2.ld）控制内存布局
#   - 不需要标准库和运行时，直接在裸机上运行
crate-type = ["staticlib"]

# ------------------------------------------------------------
# 依赖项
# ------------------------------------------------------------
[dependencies]
# BIOS bootloader 不依赖外部 crate，完全自实现
# 原因：
#   - 引导代码必须极度精简，避免引入不必要的代码
#   - 运行在 no_std 环境，大部分 crate 不可用
#   - 需要精确控制内存布局和代码生成
