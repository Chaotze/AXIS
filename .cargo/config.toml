# ============================================================
# Cargo 镜像源配置 - 使用 RsProxy 国内加速镜像
# ============================================================
# 该配置文件位于 ~/.cargo/config.toml 或项目根目录下的 .cargo/config.toml
# 用于替换 crates.io 官方源，以加速国内用户的 crate 下载和索引更新

# ------------------------------------------------------------
# 默认源替换规则
# ------------------------------------------------------------
# 将默认的 crates.io 官方源替换为下方定义的 rsproxy-sparse 源
# 这意味着所有 crate 依赖下载和索引查询都将走代理镜像
[source.crates-io]
replace-with = "rsproxy-sparse"  # 替换目标为 rsproxy-sparse 源

# ------------------------------------------------------------
# 备用源定义（HTTP 协议，非稀疏索引）
# ------------------------------------------------------------
# 使用传统的 registry-over-http 方式的索引源，保留此配置以防备用
# 当前并未启用此源（因为被 crates-io 替换指向的是 rsproxy-sparse）
[source.rsproxy]
registry = "https://rsproxy.cn/crates.io-index"

# ------------------------------------------------------------
# 实际启用的源：稀疏索引（sparse index）
# ------------------------------------------------------------
# 使用最新的稀疏索引协议（sparse+https），相比传统 HTTP 索引方式，
# 能显著减少索引克隆和更新时的网络开销，提升依赖解析速度。
# 这是 Cargo 1.68+ 支持的特性，国内用户强烈推荐使用此协议。
[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

# ============================================================
# 补充说明：
# 1. 为什么使用 sparse+https？因为稀疏索引按需获取每个 crate 的元数据，
#    而不需要像传统方式那样完整克隆整个索引仓库，尤其对于国内网络更友好。
# 2. 如果 rsproxy-sparse 访问失败，可以临时将 replace-with 改为 "rsproxy"
#    切换到传统 HTTP 索引方式作为 fallback。
# 3. 该配置同时适用于二进制依赖和开发依赖（dev-dependencies）。
# ============================================================
